<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a11" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fb" />
    <script>(()=>{const m=matchMedia('(prefers-color-scheme: dark)');const s=()=>document.documentElement.classList.toggle('dark',m.matches);s();m.addEventListener('change',s)})()</script>
    <!-- Android (Chrome): o tamanho de fonte do sistema vira o 1rem da página, em vez de zoom -->
    <meta name="text-scale" content="scale" />
    <!-- tamanho do texto do sistema (iPhone: Ajustes > Tela e Brilho > Tamanho do Texto). O padrão do iOS é 17 px = 100% do site. -->
    <script>(()=>{const r=document.documentElement;const f=()=>{const e=document.createElement('span');e.style.cssText='font:-apple-system-body;position:absolute;visibility:hidden';e.textContent='a';r.appendChild(e);const px=parseFloat(getComputedStyle(e).fontSize);e.remove();const ok=CSS.supports('font','-apple-system-body');if(!ok||!px)return;const k=Math.min(1.35,Math.max(0.85,px/17));r.style.fontSize=(16*k)+'px'};f();document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&f())})()</script>
    <script>(()=>{const no=(e)=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach((t)=>document.addEventListener(t,no,{passive:false}));document.addEventListener('touchmove',(e)=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('contextmenu',(e)=>{if(!e.target.closest('input,textarea,[contenteditable=true]'))e.preventDefault()})})()</script>
    <title>vybe · do play ao topo</title>
    <meta name="description" content="Charts do Apple Music e do Spotify, streams, posições e o histórico de cada música, todo dia." />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="vybe" />
    <meta name="application-name" content="vybe" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="vybe" />
    <meta property="og:title" content="vybe · do play ao topo" />
    <meta property="og:description" content="Charts do Apple Music e do Spotify, streams e o histórico de cada música." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og.png" />
  </head>
  <body class="antialiased">
    <noscript>O vybe precisa de JavaScript pra mostrar os charts.</noscript>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
